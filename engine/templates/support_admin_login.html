<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка — вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #080808;
            color: #fff;
        }
    </style>
</head>
<body>
    <main class="min-h-screen flex items-center justify-center p-5">
        <section class="w-full max-w-md rounded-[28px] border border-white/10 bg-[#161618] p-8 shadow-2xl">
            <div class="mb-8 text-center">
                <div class="w-14 h-14 rounded-2xl bg-[#ffc700]/10 text-[#ffc700] flex items-center justify-center mx-auto mb-4">
                    <span class="text-2xl font-black">?</span>
                </div>
                <h1 class="text-2xl font-black uppercase">Поддержка</h1>
                <p class="text-gray-500 text-sm font-bold mt-2">Вход для оператора</p>
            </div>

            {% if error %}
                <div class="mb-5 rounded-2xl border border-red-400/20 bg-red-400/10 px-4 py-3 text-red-200 text-sm font-bold">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <input type="password" name="password" placeholder="Пароль" required class="w-full rounded-2xl border border-white/10 bg-black/40 px-5 py-4 text-white font-bold outline-none focus:border-[#ffc700]/40">
                <button type="submit" class="w-full rounded-2xl bg-[#ffc700] px-5 py-4 text-black text-sm font-black uppercase">
                    Войти
                </button>
            </form>
        </section>
    </main>
</body>
</html>
