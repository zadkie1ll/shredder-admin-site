<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Shredder Admin</title><style>body{margin:0;background:#101215;color:#edf0f3;font:14px Inter,system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(380px,calc(100% - 40px));background:#171a1e;border:1px solid #2a2e34;border-radius:14px;padding:28px;box-sizing:border-box}h1{margin:0 0 8px}p{color:#aeb6c1}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:12px;border-radius:8px;border:1px solid #343942;background:#101215;color:#fff}button{background:#ffcc24;color:#17130a;font-weight:700;cursor:pointer}.error{color:#ff7d83}</style></head>
<body><form class="card" method="post">{% csrf_token %}<h1>Shredder Admin</h1><p>Вход в административную панель</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<input name="login" autocomplete="username" placeholder="Логин" required><input type="password" name="password" autocomplete="current-password" placeholder="Пароль" required><button>Войти</button></form></body></html>
