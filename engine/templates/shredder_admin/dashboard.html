<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shredder Admin</title>
<style>body{margin:0;background:#101215;color:#edf0f3;font:14px Inter,system-ui}.shell{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#aeb6c1}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:24px 0}.card{background:#171a1e;border:1px solid #2a2e34;border-radius:10px;padding:16px}.value{font-size:24px;font-weight:700;margin-top:8px}.search{display:flex;gap:8px}.search input{flex:1}.search input,button{padding:11px;border-radius:7px;border:1px solid #343942;background:#171a1e;color:#fff}button{background:#ffcc24;color:#17130a;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:11px;border-bottom:1px solid #2a2e34}tr{cursor:pointer}.detail{margin-top:18px;white-space:pre-wrap;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}</style></head>
<body><main class="shell"><header class="top"><div><h1>Shredder Control</h1><span class="muted">Read-only: пользователи, платежи, рефералы</span></div><a href="{% url 'support_admin_logout' %}" class="muted">Выйти</a></header><section id="stats" class="grid"></section><section class="card"><form id="search" class="search"><input name="q" placeholder="Telegram ID, username или email"><button>Найти</button></form><table><thead><tr><th>ID</th><th>Telegram</th><th>Username</th><th>Email</th><th>Истекает</th></tr></thead><tbody id="users"></tbody></table><pre id="detail" class="card detail" hidden></pre></section></main>
<script>const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(url){const r=await fetch(url);if(!r.ok)throw new Error((await r.json()).message||r.status);return r.json()}async function stats(){const d=(await get('{% url "support_admin_api_stats" %}')).stats;document.querySelector('#stats').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><span class="muted">${esc(k)}</span><div class="value">${esc(v)}</div></div>`).join('')}async function users(q=''){const d=await get('{% url "support_admin_api_users" %}?q='+encodeURIComponent(q));document.querySelector('#users').innerHTML=d.users.map(u=>`<tr data-id="${u.id}"><td>${u.id}</td><td>${esc(u.telegram_id)}</td><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${esc(u.expire_at)}</td></tr>`).join('')}document.querySelector('#search').onsubmit=e=>{e.preventDefault();users(new FormData(e.target).get('q')).catch(alert)};document.querySelector('#users').onclick=async e=>{const row=e.target.closest('tr');if(!row)return;const d=await get(`{% url "support_admin_api_users" %}${row.dataset.id}/`);const box=document.querySelector('#detail');box.hidden=false;box.textContent=JSON.stringify(d.user,null,2)};stats().catch(alert);users().catch(alert);</script></body></html>
