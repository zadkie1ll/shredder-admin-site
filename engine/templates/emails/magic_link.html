<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 0; background-color: #0c0c0c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; background-color: #0c0c0c; text-align: center; }
        .card { background-color: #161616; border: 1px solid #ffffff10; border-radius: 24px; padding: 40px; }
        .logo { width: 80px; height: 80px; background-color: #ffc70010; border: 1px solid #ffc70020; border-radius: 20px; margin: 0 auto 24px; line-height: 80px; color: #ffc700; font-size: 32px; }
        h1 { color: #ffffff; font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; margin-bottom: 8px; }
        p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
        .btn { display: inline-block; background-color: #ffc700; color: #000000; padding: 16px 40px; border-radius: 12px; font-weight: 900; text-decoration: none; text-transform: uppercase; font-size: 12px; letter-spacing: 0.1em; }
        .footer { margin-top: 32px; color: #4b5563; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
        .link-alt { color: #4b5563; word-break: break-all; font-size: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">⚓</div>
            <h1>Вход в личный кабинет</h1>
            <p>Вы запросили ссылку для входа в личный кабинет.</p>
            <p>Нажмите кнопку ниже, чтобы войти. Ссылка действует 15 минут.</p>
            
            <a href="{{ link }}" class="btn">Войти в кабинет</a>
            
            <div class="link-alt">
                Если кнопка не открывается, используйте ссылку:<br>
                {{ link }}
            </div>
        </div>
        <div class="footer">
            Если вы не запрашивали вход, просто проигнорируйте это письмо.
        </div>
    </div>
</body>
</html>
