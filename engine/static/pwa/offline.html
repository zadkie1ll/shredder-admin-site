<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090a0f">
    <title>Нет соединения — Monkey Island</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f5f7fb; background: radial-gradient(circle at 50% 35%, #24200d, #090a0f 48%); }
        main { width: min(100%, 420px); padding: 32px; text-align: center; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; background: rgba(18,19,26,.92); box-shadow: 0 24px 70px rgba(0,0,0,.4); }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { margin: 20px 0 10px; font-size: 28px; line-height: 1.1; }
        p { margin: 0; color: rgba(255,255,255,.66); line-height: 1.5; }
        button { width: 100%; min-height: 52px; margin-top: 24px; border: 0; border-radius: 14px; color: #090a0f; background: #ffc700; font: inherit; font-weight: 800; cursor: pointer; }
        button:focus-visible { outline: 3px solid rgba(255,199,0,.5); outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <img src="/static/icons/icon-192x192.png" alt="">
        <h1>Нет соединения</h1>
        <p>Проверьте интернет и повторите попытку. Данные личного кабинета не сохраняются для офлайн-просмотра.</p>
        <button type="button" onclick="location.reload()">Повторить</button>
    </main>
</body>
</html>
