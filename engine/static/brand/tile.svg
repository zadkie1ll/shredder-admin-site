    <path d="M52 172 Q64 160 76 172 Q64 184 52 172 Z"/>
    <path d="M76 172 Q86 166 94 172"/>
  </g>
  <g fill="#FFC700" opacity=".45">
    <!-- дублоны -->
    <circle cx="120" cy="120" r="5"/>
    <circle cx="120" cy="120" r="10" fill="none" stroke="#FFC700" stroke-width="1.5"/>
    <circle cx="36" cy="108" r="3"/>
    <circle cx="208" cy="228" r="3"/>
    <circle cx="148" cy="36" r="2.5"/>
    <circle cx="92" cy="216" r="2.5"/>
  </g>
  <g fill="#38D996" opacity=".4">
    <circle cx="228" cy="120" r="2"/>
    <circle cx="12" cy="120" r="2"/>
    <circle cx="120" cy="12" r="2"/>
    <circle cx="120" cy="228" r="2"/>
  </g>
</svg>
