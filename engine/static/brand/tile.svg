    <!-- пальмовая ветвь -->
    <path d="M36 44 Q56 28 80 30"/>
    <path d="M44 40 L48 30 M54 36 L60 26 M66 32 L72 24"/>
    <!-- вторая ветвь -->
    <path d="M204 168 Q184 184 160 182"/>
