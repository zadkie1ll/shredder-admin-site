services:
  app:
    build:
      context: ../..
      dockerfile: docker/website/Dockerfile
    image: monkey-island-website:prod
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
    networks:
      - monkey-island-network

  nginx:
    image: nginx:1.27-alpine
    env_file:
      - .env
    depends_on:
      - app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - staticfiles:/var/www/static:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./origin-allowlist:/etc/nginx/origin:ro
    networks:
      - monkey-island-network

volumes:
  staticfiles:

networks:
  monkey-island-network:
    external: true
